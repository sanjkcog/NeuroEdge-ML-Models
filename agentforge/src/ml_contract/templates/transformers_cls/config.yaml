# Generated by /model-build from use_case.lock.json and model/base/loader.json (ADR-0028 D-6).
# Tune `train` and `baseline` on the GPU box. Do NOT edit `contract`, `base_model` or `export.opset`:
# train.py and eval.py refuse to run when they disagree with the lock or with the fetched weights.

arch: {{ARCH}}
template: transformers-classification
seed: 1337

paths:
  model_folder: {{MODEL_FOLDER}}          # from this folder to the model folder
  train_split: data/splits/train.json      # relative to the model folder
  val_split: data/splits/val.json          # test.json is named nowhere here: only eval.py is given it

contract:                                  # copied from the lock, never chosen here
  use_case_id: {{USE_CASE_ID}}
  lock_sha256: {{LOCK_SHA256}}
  class_names: {{CLASS_NAMES}}
  input:
    height: {{HEIGHT}}
    width: {{WIDTH}}
    color_order: {{COLOR_ORDER}}
  preprocess: {{PREPROCESS}}
  output_schema: class_logits

base_model:                                # copied from model/base/, written by /model-fetch
  folder: model/base
  model_id: {{MODEL_ID}}
  catalogue_id: {{CATALOGUE_ID}}
  weights_sha256: {{WEIGHTS_SHA256}}
  licence: {{LICENCE}}
  distribution: {{DISTRIBUTION}}

train:
  epochs: 20
  batch_size: 32
  lr: 0.00002                              # the whole network; low, because the backbone is pretrained
  head_lr: 0.001                           # the linear probe's new head
  weight_decay: 0.05
  early_stopping_patience: 5               # on validation macro-F1
  num_workers: 4
  augment:
    horizontal_flip: false                 # only when a mirrored image is still a valid sample of its class

baseline:                                  # a linear probe: frozen backbone, new head, same split, same metrics
  epochs: 10

eval:
  batch_size: 32

export:
  opset: {{OPSET}}                         # the device runtime's pin (NeuroEdge-Web ADR-0001 W-3). A joint decision.
